name: Build Shadowport

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install musl-tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Compile Static Binary (x64 with DNS)
      run: |
        musl-gcc -static -DENABLE_DNS -o shadowport-linux-x64 shadowport.c -O2
        echo "Binary size: $(du -h shadowport-linux-x64 | cut -f1)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowport-linux-x64
        path: shadowport-linux-x64

  build-armv5:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ARM Cross-Compiler
      run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi

    - name: Compile Static Binary (ARMv5 No DNS)
      run: |
        arm-linux-gnueabi-gcc -static -march=armv5te -o shadowport-armv5 shadowport.c -O2
        echo "Binary size: $(du -h shadowport-armv5 | cut -f1)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowport-armv5
        path: shadowport-armv5

  build-armv7:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ARM Cross-Compiler
      run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

    - name: Compile Static Binary (ARMv7 No DNS)
      run: |
        arm-linux-gnueabihf-gcc -static -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -o shadowport-armv7 shadowport.c -O2
        echo "Binary size: $(du -h shadowport-armv7 | cut -f1)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowport-armv7
        path: shadowport-armv7

  build-macos-x64:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Dynamic Binary (macOS x64 with DNS)
      run: |
        clang -arch x86_64 -DENABLE_DNS -o shadowport-macos-x64 shadowport.c -O2
        echo "Binary info: $(file shadowport-macos-x64)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowport-macos-x64
        path: shadowport-macos-x64

  build-macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Dynamic Binary (macOS ARM64 with DNS)
      run: |
        clang -arch arm64 -DENABLE_DNS -o shadowport-macos-arm64 shadowport.c -O2
        echo "Binary info: $(file shadowport-macos-arm64)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowport-macos-arm64
        path: shadowport-macos-arm64

  build-windows-x64:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Compile Windows Executable
      run: pyinstaller --onefile --console --name shadowport-windows-x64 shadowport.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadowport-windows-x64
        path: dist/shadowport-windows-x64.exe

  update-release:
    needs: [build-linux-x64, build-armv5, build-armv7, build-macos-x64, build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare binaries
        run: |
          mkdir -p release-staging
          cp shadowport-linux-x64/shadowport-linux-x64 release-staging/
          cp shadowport-armv5/shadowport-armv5 release-staging/
          cp shadowport-armv7/shadowport-armv7 release-staging/
          cp shadowport-macos-x64/shadowport-macos-x64 release-staging/
          cp shadowport-macos-arm64/shadowport-macos-arm64 release-staging/
          cp shadowport-windows-x64/shadowport-windows-x64.exe release-staging/
          chmod +x release-staging/shadowport-linux-* release-staging/shadowport-arm* release-staging/shadowport-macos-*
          ls -lh release-staging/

      - name: Recreate "latest" Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-staging
          
          RELEASE_ID=$(gh release view latest --json id --jq '.id' 2>/dev/null || echo "")
          if [ ! -z "$RELEASE_ID" ]; then
            echo "Deleting existing 'latest' release..."
            gh release delete latest --yes --cleanup-tag
          fi

          echo "Creating new 'latest' release..."
          gh release create latest --title "Latest Build" --notes "Automated build from master branch." --latest

          echo "Uploading shadowport-linux-x64..."
          gh release upload latest shadowport-linux-x64
          
          echo "Uploading shadowport-armv5..."
          gh release upload latest shadowport-armv5
          
          echo "Uploading shadowport-armv7..."
          gh release upload latest shadowport-armv7

          echo "Uploading shadowport-macos-x64..."
          gh release upload latest shadowport-macos-x64
          
          echo "Uploading shadowport-macos-arm64..."
          gh release upload latest shadowport-macos-arm64

          echo "Uploading shadowport-windows-x64..."
          gh release upload latest shadowport-windows-x64.exe